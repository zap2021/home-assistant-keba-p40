name: Fehler melden
description: Melde ein reproduzierbares Problem mit der Integration.
title: "[Fehler]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Danke für den Bericht. Entferne bitte Zugangsdaten, private IP-Adressen, Seriennummern und RFID-Daten aus allen Angaben.
  - type: input
    id: integration_version
    attributes:
      label: Integrationsversion
      description: Version aus Home Assistant oder HACS.
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home-Assistant-Version
    validations:
      required: true
  - type: input
    id: firmware_version
    attributes:
      label: Wallbox-Firmware-Version
  - type: textarea
    id: description
    attributes:
      label: Fehlerbeschreibung
      description: Was ist passiert und was wurde erwartet?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevante Protokolle
      description: Bitte anonymisieren und keine Geheimnisse oder persönlichen Daten einfügen.
      render: text
